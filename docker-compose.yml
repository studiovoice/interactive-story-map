# Local services for development: Postgres (with PostGIS) and S3-compatible storage (RustFS).
# The app itself runs on the host with `pnpm dev`. See docs/plans/postgres-and-s3.md.
#
#   pnpm services:up      start (waits until healthy, creates the bucket)
#   pnpm services:down    stop, keep data
#   pnpm services:reset   stop and delete all data, then start fresh
#
# Credentials here are for local development only and match .env.example.

name: story-map

services:
  db:
    image: postgis/postgis:18-3.7
    environment:
      POSTGRES_USER: story
      POSTGRES_PASSWORD: story
      POSTGRES_DB: story_map
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data in a versioned folder under /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U story -d story_map"]
      interval: 2s
      timeout: 5s
      retries: 30

  # RustFS runs as UID 10001; make sure the named volume is writable by it.
  storage-permissions:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - storage-data:/data

  storage:
    image: rustfs/rustfs:1.0.4
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfs-dev
      RUSTFS_SECRET_KEY: rustfs-dev-secret
      # Lets the browser PUT uploads and GET media from the app's origin.
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:3000
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: http://localhost:9001
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console (log in with the access/secret key above)
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: create the bucket and set its CORS rules, then exit. Uses the AWS CLI so the same
  # commands work against S3 and R2 (see scripts/storage/cors.json).
  storage-init:
    image: amazon/aws-cli:2.39.1
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfs-dev
      AWS_SECRET_ACCESS_KEY: rustfs-dev-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://storage:9000
      BUCKET: story-map-media
    volumes:
      - ./scripts/storage/cors.json:/cors.json:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        aws s3api head-bucket --bucket "$$BUCKET" 2>/dev/null || aws s3api create-bucket --bucket "$$BUCKET"
        aws s3api put-bucket-cors --bucket "$$BUCKET" --cors-configuration file:///cors.json
        echo "Bucket $$BUCKET ready"

volumes:
  db-data:
  storage-data:
